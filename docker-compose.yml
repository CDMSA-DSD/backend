services:
  # UNICO DATABASE: Dati + Vettori
  database:
    image: pgvector/pgvector:pg16
    container_name: cdmsa-postgres
    environment:
      POSTGRES_DB: cdmsa
      POSTGRES_USER: cdmsa
      POSTGRES_PASSWORD: cdmsa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdmsa"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: